<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de perseguição</title>
<style>
:root{--bg:#14110f;--panel:#1e1916;--line:#3a312b;--fg:#f1e7da;--mut:#a39382;--accent:#ff8a2a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:24px 16px 56px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}h1{font-size:26px;margin:0}p{margin:0;color:var(--mut)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:13px}
button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit}
button[aria-pressed=true]{background:var(--accent);color:#1b0d05;border-color:var(--accent);font-weight:600}
canvas{width:100%;max-width:720px;aspect-ratio:480/300;border-radius:8px;image-rendering:pixelated;background:#222;align-self:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.votes{display:flex;gap:8px;flex-wrap:wrap}textarea{width:100%;min-height:60px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
.result{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:16px}.result pre{margin:0;white-space:pre-wrap}
</style>
<main>
 <div><h1 id="tit"></h1><p>Perseguição: o alvo está no ar, o ninja salta, mergulha com o chute, o alvo despenca e ele pousa. Gerado por <code>tools/perseg_teste.py</code>.</p></div>
 <div class="card">
  <canvas id="cv" width="480" height="300"></canvas>
  <div class="ctl"><span>Velocidade</span><button id="s1" aria-pressed="true">1x</button><button id="s2" aria-pressed="false">0,5x</button><button id="s3" aria-pressed="false">0,25x</button></div>
  <div class="votes" id="vb"></div><textarea id="ta" placeholder="O que mudar? (opcional)"></textarea>
 </div>
 <div class="result" id="result" hidden><pre id="resTxt"></pre><p>Copie esse texto e cole no chat.</p></div>
</main>
<script>
(function(){
var D=__DATA__,W=480,H=300,GY=D.gy,KX=D.kx;
var PALS={brasa:[[0,[44,12,8]],[.35,[118,34,20]],[.65,[206,76,34]],[.9,[250,152,72]],[1,[255,226,172]]],earth:[[0,[36,26,16]],[.35,[90,70,48]],[.65,[160,134,96]],[.9,[216,196,154]],[1,[255,243,214]]],fire:[[0,[42,13,8]],[.35,[122,42,18]],[.65,[232,116,42]],[.9,[255,199,102]],[1,[255,244,207]]]};
function gm(st,l){for(var i=1;i<st.length;i++){if(l<=st[i][0]){var a=st[i-1],b=st[i],k=(l-a[0])/(b[0]-a[0]);return [0,1,2].map(function(c){return a[1][c]+(b[1][c]-a[1][c])*k})}}return st[st.length-1][1]}
function cl(x,a,b){return Math.max(a===undefined?0:a,Math.min(b===undefined?1:b,x))}function eo(x){x=cl(x);return 1-(1-x)*(1-x)}function es(x){x=cl(x);return x*x*(3-2*x)}

function load(k,src){need.push(k);var i=new Image();i.onload=function(){if(++loaded==need.length)ready=true};i.src=src;IM[k]=i}
load('kaen','kaen.png');load('alvo','alvo.png');load('kitA','fx_kitA.png');load('kitC','fx_kitC.png');NAMES.forEach(function(n){load(n,'p_'+n+'.png')});

function strFrame(name,col,pal){var key=name+col+pal;if(TC[key])return TC[key];var cv=document.createElement('canvas');cv.width=256;cv.height=256;var g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(IM[name],col*256,0,256,256,0,0,256,256);if(pal)tint(cv,pal);TC[key]=cv;return cv}

function put(c,cv,x,y,sc,rot,ay,o){o=o||{};c.save();c.translate(x,y);c.rotate(rot||0);c.scale(sc*(o.fx||1),sc);c.globalAlpha=o.a===undefined?1:o.a;c.imageSmoothingEnabled=false;c.drawImage(cv,-128,-ay);c.restore()}
function strip(c,name,tau,fps,x,y,sc,o){o=o||{};if(tau<0)return;var f=Math.floor(tau*fps);if(f>5){if(!o.loop)return;f%=6}put(c,strFrame(name,f,o.pal||null),x,y,sc,o.rot,o.bottom?246:128,o)}
function kit(c,sheet,row,tau,fps,pal,x,y,sc,o){o=o||{};if(tau<0)return;var f=Math.floor(tau*fps);if(f>5)return;put(c,kitFrame(sheet,row,f,pal),x,y,sc,o.rot,o.bottom?246:128,o)}
var IW={launched:[14,8,10],knockdown:[15,8,8],hurt:[5,3,10]};
function alvo(c,an,fr,x,y,rot,o){var a=IW[an];o=o||{};c.save();c.translate(x,y);c.rotate(rot||0);c.scale(-.95*(o.sx||1),.95*(o.sy||1));c.imageSmoothingEnabled=false;c.drawImage(IM.alvo,Math.min(a[1]-1,fr)*192,a[0]*160,192,160,-96,-150,192,160);c.restore()}
function kaen(c,f,x,y){var cell=D.cell,col=f%D.cols,row=Math.floor(f/D.cols);c.save();c.translate(x,y);c.scale(D.s,D.s);c.imageSmoothingEnabled=false;c.drawImage(IM.kaen,col*cell,row*cell,cell,cell,-cell/2,-D.foot,cell,cell);c.restore()}
function stage(c){var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3d4636');g.addColorStop(.7,'#2c3326');g.addColorStop(.7,'#4d4a38');g.addColorStop(1,'#3a3829');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='rgba(0,0,0,.18)';for(var i=0;i<9;i++)c.fillRect(i*60+((i*37)%20),GY+10+((i*53)%40),26,2)}
function dmg(c,tau,x,y,txt,big,life){life=life||1;if(tau<0||tau>life)return;var k=tau/life;c.save();c.textAlign='center';c.font='bold '+(big?30:24)+'px sans-serif';var s=1+.5*Math.exp(-tau*14)*Math.cos(tau*18),al=k>.7?1-(k-.7)/.3:1;c.translate(x,y-30*eo(k*1.4));c.scale(s,s);c.globalAlpha=al;c.lineWidth=5;c.strokeStyle='#2a0d08';c.strokeText(txt,0,0);c.fillStyle='#fff4cf';c.fillText(txt,0,0);c.restore()}
/* keyframes por POSE (índice começa em 1): x e altura extra do salto, em px. O sprite já traz a inclinação; o código leva o corpo pelo palco. */
var AX=D.alvoX,ALT=D.alvoAlt,TIPX=D.ponta[0],TIPY=D.ponta[1];
var altC=ALT+58;                                     // altura do pé no contato (atinge o peito do alvo)
var XC=AX-TIPX,XL=AX+55-TIPX+20;                       // x do ninja no contato e no pouso
var KX_=[[1,KX],[2,KX],[3,KX+24],[4,KX+70],[5,KX+120],[6,KX+160],[7,KX+200],[8,(KX+200+XC)/2+10],[D.contato,XC],[D.contato+2,XL],[D.pouso-1,XL],[D.n+1,XL]];
var KY_=[[1,0],[2,0],[3,28],[4,58],[5,80],[6,90],[7,92],[8,96],[D.contato,altC-6],[D.contato+1,80],[D.contato+2,30],[D.pouso-2,6],[D.pouso-1,0],[D.n+1,0]];
function kf(arr,p){if(p<=arr[0][0])return arr[0][1];for(var i=1;i<arr.length;i++){if(p<=arr[i][0]){var a=arr[i-1],b=arr[i],t=(p-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*es(t)}}return arr[arr.length-1][1]}
var tC=(D.contato-1)/D.fps,STOP=.09,tLand=(D.pouso-1)/D.fps,tFloor=tC+.16;
function tgOf(T){return T-Math.min(Math.max(T-tC,0),STOP)}
function Wof(te){return te+(te>=tC?STOP:0)}
var LEN=tLand+STOP+2.2;
function draw(c,T){stage(c);var t=tgOf(T),pf=t*D.fps+1,f=Math.min(D.n-1,Math.floor(t*D.fps)),kx=kf(KX_,pf),ky=kf(KY_,pf);
 var tauC=T-Wof(tC),tauF=T-Wof(tFloor),tauL=T-Wof(tLand);
 // alvo: flutuando no ar (estado Voo) até o contato; depois despenca na diagonal e fica caído
 var ex,ey,erot,an,afr;
 if(t<tC){ex=AX+Math.sin(T*3)*3;ey=GY-ALT+Math.sin(T*4)*3;erot=-.35+Math.sin(T*3)*.08;an='launched';afr=3}
 else{var u=cl((t-tC)/.16),tx=AX+55;ex=AX+(tx-AX)*eo(u);ey=GY-ALT+ALT*u*u;erot=-.35+(1.3+.35)*es(u);an=u<1?'launched':'knockdown';afr=u<1?4:Math.floor((t-tFloor)*8);if(u>=1){erot=0;ey=GY}}
 if(t>=tFloor&&t<tFloor+.35){var q=Math.exp(-(t-tFloor)*12)*Math.cos((t-tFloor)*30);}
 alvo(c,an,afr,ex,ey,erot,{});
 // rastro de fogo e brasas durante o mergulho
 if(pf>=6.4&&pf<D.contato+2.5){var al=pf>D.contato+1.5?1-(pf-D.contato-1.5):1;strip(c,'fogo_cauda',T,12,kx-18,GY-ky-46,.62,{loop:1,rot:.85,a:.9*al});strip(c,'brasas',T,10,kx-6,GY-ky-40,.4,{loop:1,a:.7*al})}
 // poeira e brasas no impulso (sai do chão)
 var tl=T-Wof(2.2/D.fps);if(tl>=0&&tl<.6){var df=Math.floor(tl*14);if(df<=5){put(c,kitFrame('kitA',0,df,'earth'),KX+8,GY+6,.42,0,246,{fx:-1});strip(c,'brasas',tl,10,KX+8,GY-12,.35,{loop:1,a:.8*(1-tl/.6)})}}
 kaen(c,f,kx,GY-ky);

 var px=kx+TIPX,py=GY-ky-TIPY;
 kit(c,'kitC',3,tauC,20,'fire',px+8,py-4,.55);kit(c,'kitC',2,tauC-.02,22,'fire',px+10,py-4,.4);strip(c,'impacto_brasa',tauC,14,px,py-4,.78);strip(c,'fragmentos',tauC-.04,10,px+6,py-10,.5,{pal:'brasa'});
 // alvo bate no chão: explosão, poeira e fogo; ninja pousa: poeira e brasas
 strip(c,'impacto_brasa',tauF,12,AX+55,GY-72,.55);strip(c,'fogo_chao',tauF,10,AX+55,GY+8,.5,{bottom:1,loop:1,a:tauF>1.1?Math.max(0,1-(tauF-1.1)/.5):1});
 var dd=Math.floor(tauF*12);if(dd>=0&&dd<=5){put(c,kitFrame('kitA',0,dd,'earth'),AX+55-34,GY+8,.5,0,246);put(c,kitFrame('kitA',0,dd,'earth'),AX+55+34,GY+8,.5,0,246,{fx:-1});put(c,kitFrame('kitA',2,Math.min(5,Math.floor(tauF*10)),'brasa'),AX+55,GY-18,.55,0)}
 var dl=Math.floor(tauL*12);if(tauL>=0&&dl<=5){put(c,kitFrame('kitA',0,dl,'earth'),kx-34,GY+8,.55,0,246);put(c,kitFrame('kitA',0,dl,'earth'),kx+34,GY+8,.55,0,246,{fx:-1});strip(c,'impacto_brasa',tauL,14,kx,GY-18,.4)}
 dmg(c,tauC,px-34,py-86,'236',false,.42);dmg(c,tauF-.05,AX+55+26,GY-110,'320',true)}
var st=null,notes='',vb=document.getElementById('vb');
document.getElementById('tit').textContent=D.titulo;
[['Aprovado','ok'],['Tem coisa pra mudar','mudar']].forEach(function(o){var b=document.createElement('button');b.textContent=o[0];b.setAttribute('aria-pressed','false');b.onclick=function(){st=o[1];[].forEach.call(vb.children,function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');fim()};vb.appendChild(b)});
document.getElementById('ta').oninput=function(e){notes=e.target.value;fim()};

var sp=1;function setS(v,id){sp=v;['s1','s2','s3'].forEach(function(k){document.getElementById(k).setAttribute('aria-pressed',k==id)})}

var c=document.getElementById('cv').getContext('2d'),clock=0,last=0;
