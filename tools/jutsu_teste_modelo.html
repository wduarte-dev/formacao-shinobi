<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de jutsu</title>
<style>

.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:13px}

.result{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:16px}.result pre{margin:0;white-space:pre-wrap}
</style>

 <div class="card">
  <canvas id="cv" width="480" height="300"></canvas>
  <div class="ctl"><span>Velocidade</span><button id="s1" aria-pressed="true">1x</button><button id="s2" aria-pressed="false">0,5x</button><button id="s3" aria-pressed="false">0,25x</button></div>
  <div class="votes" id="vb"></div><textarea id="ta" placeholder="O que mudar? (opcional)"></textarea>
 </div>
 <div class="result" id="result" hidden><pre id="resTxt"></pre><p>Copie esse texto e cole no chat.</p></div>
</main>
