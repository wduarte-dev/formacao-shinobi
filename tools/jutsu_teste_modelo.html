<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de jutsu</title>
<style>
:root{--bg:#14110f;--panel:#1e1916;--line:#3a312b;--fg:#f1e7da;--mut:#a39382;--accent:#ff8a2a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:24px 16px 56px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}h1{font-size:26px;margin:0}p{margin:0;color:var(--mut)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:13px}
button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit}
button[aria-pressed=true]{background:var(--accent);color:#1b0d05;border-color:var(--accent);font-weight:600}
canvas{width:100%;max-width:720px;aspect-ratio:480/300;border-radius:8px;image-rendering:pixelated;background:#222;align-self:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.votes{display:flex;gap:8px;flex-wrap:wrap}textarea{width:100%;min-height:60px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
.result{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:16px}.result pre{margin:0;white-space:pre-wrap}
</style>
<main>
 <div><h1 id="tit"></h1><p>O ninja fica parado no selo montado até executar. O dragão sai das mãos em peças, cruza a fileira, bate nos alvos e no chão e se desintegra peça por peça. Gerado por <code>tools/jutsu_teste.py</code>.</p></div>
 <div class="card">
  <canvas id="cv" width="480" height="300"></canvas>
  <div class="ctl"><span>Velocidade</span><button id="s1" aria-pressed="true">1x</button><button id="s2" aria-pressed="false">0,5x</button><button id="s3" aria-pressed="false">0,25x</button></div>
  <div class="votes" id="vb"></div><textarea id="ta" placeholder="O que mudar? (opcional)"></textarea>
 </div>
 <div class="result" id="result" hidden><pre id="resTxt"></pre><p>Copie esse texto e cole no chat.</p></div>
</main>
<script>
(function(){
var D=__DATA__,W=480,H=300,GY=D.gy,KX=D.kx,DR=D.dragao;
var PALS={brasa:[[0,[44,12,8]],[.35,[118,34,20]],[.65,[206,76,34]],[.9,[250,152,72]],[1,[255,226,172]]],
 earth:[[0,[36,26,16]],[.35,[90,70,48]],[.65,[160,134,96]],[.9,[216,196,154]],[1,[255,243,214]]]};
function gm(st,l){for(var i=1;i<st.length;i++){if(l<=st[i][0]){var a=st[i-1],b=st[i],k=(l-a[0])/(b[0]-a[0]);return [0,1,2].map(function(c){return a[1][c]+(b[1][c]-a[1][c])*k})}}return st[st.length-1][1]}
function cl(x,a,b){return Math.max(a===undefined?0:a,Math.min(b===undefined?1:b,x))}
function eo(x){x=cl(x);return 1-(1-x)*(1-x)}function es(x){x=cl(x);return x*x*(3-2*x)}
var NAMES=['cabeca','corpo','cauda','cabeca_desintegra','corpo_desintegra','cauda_desintegra','impacto_chao','fragmentos','fogo_crista','fogo_corpo','fogo_cauda','brasas','impacto_brasa','queima_loop','chuva_brasa','fogo_chao'];
var IM={},need=[],loaded=0,ready=false;
function load(k,src){need.push(k);var i=new Image();i.onload=function(){if(++loaded==need.length)ready=true};i.src=src;IM[k]=i}
load('kaen','kaen.png');load('alvo','alvo.png');load('kitA','fx_kitA.png');NAMES.forEach(function(n){load(n,'p_'+n+'.png')});
var TC={};
function frame(name,col,pal){var key=name+col+pal;if(TC[key])return TC[key];var cv=document.createElement('canvas');cv.width=256;cv.height=256;var g=cv.getContext('2d');g.imageSmoothingEnabled=false;
 g.drawImage(IM[name],col*256,0,256,256,0,0,256,256);if(pal&&pal!=='none'){var d=g.getImageData(0,0,256,256),p=d.data,st=PALS[pal];for(var i=0;i<p.length;i+=4){if(!p[i+3])continue;var l=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)/255,m=gm(st,l);p[i]=m[0];p[i+1]=m[1];p[i+2]=m[2]}g.putImageData(d,0,0)}
 TC[key]=cv;return cv}
function kitFrame(row,col){var key='kA'+row+col;if(TC[key])return TC[key];var cv=document.createElement('canvas');cv.width=256;cv.height=256;var g=cv.getContext('2d');g.imageSmoothingEnabled=false;
 g.drawImage(IM.kitA,col*256,row*256,256,256,0,0,256,256);var d=g.getImageData(0,0,256,256),p=d.data,st=PALS.earth;for(var i=0;i<p.length;i+=4){if(!p[i+3])continue;var l=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)/255,m=gm(st,l);p[i]=m[0];p[i+1]=m[1];p[i+2]=m[2]}g.putImageData(d,0,0);TC[key]=cv;return cv}
/* peça: ancora (ax,ay) em coordenadas da célula 256, posição (x,y) no palco */
function piece(c,cv,x,y,sc,rot,ax,ay,o){o=o||{};c.save();c.translate(x,y);c.rotate(rot||0);c.scale(sc*(o.fx||1),sc);c.globalAlpha=o.a===undefined?1:o.a;c.imageSmoothingEnabled=false;c.drawImage(cv,-ax,-ay);c.restore()}
/* geometria do dragão */
var P=D.pecas,sc=DR.escala,bodyEsp=(P.corpo.espL+P.corpo.espR)/2;
var sH=sc*bodyEsp/P.cabeca.espL,sT=sc*bodyEsp/P.cauda.espR;
var Lb=(P.corpo.r-P.corpo.l)*sc,Lt=(P.cauda.r-P.cauda.l)*sT,N=DR.segmentos;
var aH=[P.cabeca.l,P.cabeca.cyL],aB=[(P.corpo.l+P.corpo.r)/2,(P.corpo.cyL+P.corpo.cyR)/2],aT=[P.cauda.r,P.cauda.cyR];
var TARG=[325,380,435],tipOff=(P.cabeca.r-P.cabeca.l)*sH*.85,x0=D.ponta[0]+4,y0=D.ponta[1],x1=TARG[D.alvos-1]-tipOff,TF=DR.voo,speed=(x1-x0)/TF,xg=TARG[D.alvos-1]-26;
var tArm=.7,tR=tArm+(D.liberacao-D.armado)/D.fps,tSlam=tR+TF;
var tauB=[];for(var k=0;k<N;k++)tauB.push((k+.5)*Lb/speed);var tauT=N*Lb/speed;
var LEN=tSlam+tauT+.5+1.6;
function Hpos(u){u=cl(u,-.0,1);var x=x0+(x1-x0)*u,y=y0-12*Math.sin(u*3.4),kd=cl((u-.78)/.22);y=y+(GY-20-y)*es(kd);return [x,y]}
function ang(u){var a=Hpos(u-.012),b=Hpos(u+.012);return Math.atan2(b[1]-a[1],b[0]-a[0])}
function uOf(t,tau){return (t-tau-tR)/TF}
/* alvos e utilidades */
var IW={idle:[0,8,8,1],hurt:[5,3,10,0]};
function alvo(c,an,tau,x,o){var a=IW[an],f=Math.floor(Math.max(0,tau)*a[2]);f=a[3]?f%a[1]:Math.min(a[1]-1,f);c.save();c.translate(x,GY);c.scale(-1*(o.sx||1),1*(o.sy||1));c.imageSmoothingEnabled=false;c.drawImage(IM.alvo,f*192,a[0]*160,192,160,-96,-150,192,160);c.restore()}
function kaen(c,f){var cell=D.cell,col=f%D.cols,row=Math.floor(f/D.cols);c.save();c.translate(KX,GY);c.scale(D.s,D.s);c.imageSmoothingEnabled=false;c.drawImage(IM.kaen,col*cell,row*cell,cell,cell,-cell/2,-D.foot,cell,cell);c.restore()}
function stage(c){var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3d4636');g.addColorStop(.7,'#2c3326');g.addColorStop(.7,'#4d4a38');g.addColorStop(1,'#3a3829');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='rgba(0,0,0,.18)';for(var i=0;i<9;i++)c.fillRect(i*60+((i*37)%20),GY+10+((i*53)%40),26,2)}
function dmg(c,tau,x,y,txt){var life=.9;if(tau<0||tau>life)return;var k=tau/life;c.save();c.textAlign='center';c.font='bold 24px sans-serif';var s=1+.5*Math.exp(-tau*14)*Math.cos(tau*18),al=k>.7?1-(k-.7)/.3:1;c.translate(x,y-30*eo(k*1.4));c.scale(s,s);c.globalAlpha=al;c.lineWidth=5;c.strokeStyle='#2a0d08';c.strokeText(txt,0,0);c.fillStyle='#fff4cf';c.fillText(txt,0,0);c.restore()}
function strip(c,name,tau,fps,x,y,sc2,o){o=o||{};if(tau<0)return;var f=Math.floor(tau*fps);if(f>5){if(!o.loop)return;f=f%6}piece(c,frame(name,f,o.pal||'none'),x,y,sc2,o.rot,128,o.bottom?246:128,o)}
function draw(c,T){stage(c);
 // alvos
 var hitT=TARG.slice(0,D.alvos).map(function(x){return tR+cl((x-tipOff-x0)/(x1-x0))*TF});
 TARG.slice(0,D.alvos).forEach(function(x,j){var tau=T-hitT[j],off=0,sq=0;if(tau>=0){off=7*Math.exp(-tau*10)*(1-Math.exp(-tau*40));sq=Math.exp(-tau*10)*Math.cos(tau*26)}
  alvo(c,tau>=0&&tau<.34?'hurt':'idle',tau>=0?tau:T,x+off,{sx:.85*(1+.1*sq),sy:.85*(1-.08*sq)})});
 // kaen: selo montado parado, depois executa
 var f=T<tArm?D.armado:Math.min(D.n-1,D.armado+Math.floor((T-tArm)*D.fps));kaen(c,f);
 // dragão (peças de trás pra frente)
 var ph=Math.floor(T*8);
 var tailU=uOf(T,tauT),tailDie=tSlam+tauT;
 if(tailU>=0){var u=cl(tailU),p=Hpos(u),r=ang(u);
  if(T<tailDie){piece(c,frame('fogo_cauda',(ph+1)%6,'none'),p[0],p[1],sT,r,aT[0],aT[1],{a:.9});piece(c,frame('cauda',(ph+3)%6,'brasa'),p[0],p[1],sT,r,aT[0],aT[1])}
  else piece(c,frame('cauda_desintegra',Math.min(5,Math.floor((T-tailDie)*12)),'brasa'),p[0],p[1],sT,r,aT[0],aT[1],{a:(T-tailDie)<.55?1:0})}
 for(var k=N-1;k>=0;k--){var uk=uOf(T,tauB[k]);if(uk<0)continue;var u2=cl(uk),p2=Hpos(u2),r2=ang(u2),die=tSlam+tauB[k];
  if(T<die){piece(c,frame('fogo_corpo',(ph+k+2)%6,'none'),p2[0],p2[1]-3,sc,r2,aB[0],aB[1],{a:.9});piece(c,frame('corpo',(ph+k)%6,'brasa'),p2[0],p2[1],sc,r2,aB[0],aB[1])}
  else{var fd=Math.floor((T-die)*12);if(fd<=5)piece(c,frame('corpo_desintegra',fd,'brasa'),p2[0],p2[1],sc,r2,aB[0],aB[1]);strip(c,'brasas',T-die,10,p2[0],p2[1]-6,.32)}}
 var hu=uOf(T,0);
 if(hu>=0){var hp=Hpos(cl(hu)),hr=ang(cl(hu));
  if(T<tSlam){piece(c,frame('fogo_crista',(ph+2)%6,'none'),hp[0]-4,hp[1]-2,sH,hr,aH[0],aH[1],{a:.9});piece(c,frame('cabeca',ph%6,'brasa'),hp[0],hp[1],sH,hr,aH[0],aH[1])}
  else{var fh=Math.floor((T-tSlam)*12);if(fh<=5)piece(c,frame('cabeca_desintegra',fh,'brasa'),hp[0],hp[1],sH,hr,aH[0],aH[1])}}
 // batida no chão (poeira e estilhaços são do kit, separados do dragão)
 var ts=T-tSlam;
 if(ts>=0){strip(c,'impacto_chao',ts,10,xg,GY+6,.5,{bottom:1});
  var dd=Math.floor(ts*12);if(dd<=5){piece(c,kitFrame(0,dd),xg-30,GY+6,.5,0,128,246);piece(c,kitFrame(0,dd),xg+36,GY+6,.5,0,128,246,{fx:-1});piece(c,kitFrame(2,Math.min(5,Math.floor(ts*10))),xg+4,GY-14,.55,0,128,128)}}
 // contato, queima e brasas nos alvos
 TARG.slice(0,D.alvos).forEach(function(x,j){var tau=T-hitT[j];
  strip(c,'impacto_brasa',tau,14,x,GY-58,.5);strip(c,'fragmentos',tau-.05,10,x-8,GY-70,.4);
  if(tau>=0&&tau<1.5){strip(c,'queima_loop',tau,10,x,GY+4,.4,{loop:1,bottom:1,a:(tau>1.2?1-(tau-1.2)/.3:1)*.85});strip(c,'chuva_brasa',tau,8,x,GY-55,.45,{loop:1,a:.8})}
  dmg(c,tau,x-4,GY-122,['152','148','210'][j%3])})}
var st=null,notes='',vb=document.getElementById('vb');
document.getElementById('tit').textContent=D.titulo;
[['Aprovado','ok'],['Tem coisa pra mudar','mudar']].forEach(function(o){var b=document.createElement('button');b.textContent=o[0];b.setAttribute('aria-pressed','false');b.onclick=function(){st=o[1];[].forEach.call(vb.children,function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');fim()};vb.appendChild(b)});
document.getElementById('ta').oninput=function(e){notes=e.target.value;fim()};
function fim(){if(!st)return;document.getElementById('resTxt').textContent=D.titulo+': '+(st=='ok'?'aprovado':'mudar')+(notes?' ('+notes+')':'');document.getElementById('result').hidden=false}
var speed2=1;function setS(v,id){speed2=v;['s1','s2','s3'].forEach(function(k){document.getElementById(k).setAttribute('aria-pressed',k==id)})}
s1.onclick=function(){setS(1,'s1')};s2.onclick=function(){setS(.5,'s2')};s3.onclick=function(){setS(.25,'s3')};
var c=document.getElementById('cv').getContext('2d'),clock=0,last=0;
function loop(now){clock+=(now-last)/1000*speed2;last=now;if(ready){var T=(window.__T!==undefined)?window.__T:clock%LEN;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);draw(c,T)}requestAnimationFrame(loop)}
window.__LEN=LEN;requestAnimationFrame(function(n){last=n;requestAnimationFrame(loop)});
})();
</script>
